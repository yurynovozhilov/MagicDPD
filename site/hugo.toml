baseURL = "https://magicdpd.com/"
languageCode = "ru"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = true
title = "MagicDPD: Magic Driven Product Development!"
theme = "anubis"
paginate = 20
# Keep relative URLs working both locally and on GitHub Pages
canonifyURLs = false
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[params]
  dateFormat = "02.01.2006"
  paginationSinglePost = true
  style = "auto"
  mainSections = ["posts"]
  readMore = false
  toc = true
  tocWordCount = 300
  rssAsSocialIcon = true
  customCSS = ["css/link-previews.css", "css/infinite-scroll.css"]
  customJS = ["js/link-previews.js", "js/infinite-scroll.js"]

  [[params.social]]
    id = "telegram"
    url = "https://t.me/MagicDPD"

  [params.linkPreviews]
    enabled = false  # превью теперь статичны, генерируются fetch_link_previews.py


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]

  [languages.ru]
    languageName = "Русский"
    weight = 1
    title = "MagicDPD: Magic Driven Product Development!"

    [languages.ru.params]
      author = "GlukRazor"
      description = "Архив постов MagicDPD"

    [[languages.ru.menu.main]]
      identifier = "home"
      name = "Главная"
      title = "Главная"
      url = "/"
      weight = 1

    [[languages.ru.menu.main]]
      identifier = "archive"
      name = "Архив"
      title = "Архив постов"
      url = "/archive/"
      weight = 2

    [[languages.ru.menu.main]]
      identifier = "about"
      name = "О проекте"
      title = "О проекте"
      url = "/about/"
      weight = 3

  [languages.en]
    languageName = "English"
    weight = 2
    title = "MagicDPD: Magic Driven Product Development!"

    [languages.en.params]
      author = "GlukRazor"
      description = "MagicDPD post archive — CAE/FEA/CFD simulation engineering"

    [[languages.en.menu.main]]
      identifier = "home"
      name = "Home"
      title = "Home"
      url = "/"
      weight = 1

    [[languages.en.menu.main]]
      identifier = "archive"
      name = "Archive"
      title = "Post archive"
      url = "/archive/"
      weight = 2

    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      title = "About the project"
      url = "/about/"
      weight = 3
