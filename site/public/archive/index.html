<script>
const STORAGE_KEY = 'user-color-scheme'
const defaultTheme = "auto"

let currentTheme
let switchButton
let autoDefinedScheme = window.matchMedia('(prefers-color-scheme: dark)')

const autoChangeScheme = e => {
    currentTheme = e.matches ? 'dark' : 'light'
    document.documentElement.setAttribute('data-theme', currentTheme)
}

document.addEventListener('DOMContentLoaded', function() {
    switchButton = document.querySelector('.theme-switcher')
    currentTheme = detectCurrentScheme()
    if (currentTheme == 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark')
    }
    if (currentTheme == 'auto') {
        autoChangeScheme(autoDefinedScheme);
        autoDefinedScheme.addListener(autoChangeScheme);
    }

    if (switchButton) {
        switchButton.addEventListener('click', switchTheme, false)
    }
  
    showContent()
})

function detectCurrentScheme() {
    if (localStorage !== null && localStorage.getItem(STORAGE_KEY)) {
        return localStorage.getItem(STORAGE_KEY)
    } 
    if (defaultTheme) {
        return defaultTheme
    } 
    if (!window.matchMedia) {
        return 'light'
    } 
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        return 'dark'
    }
    return 'light'
}

function switchTheme(e) {
    if (currentTheme == 'dark') {
        if (localStorage !== null)
            localStorage.setItem(STORAGE_KEY, 'light')
        document.documentElement.setAttribute('data-theme', 'light')
        currentTheme = 'light'
    } else {
        if (localStorage !== null)
            localStorage.setItem(STORAGE_KEY, 'dark')
        document.documentElement.setAttribute('data-theme', 'dark')
        currentTheme = 'dark'
    }
}

function showContent() {
    document.body.style.visibility = 'visible';
    document.body.style.opacity = 1;
}
</script>

рочностного решателя #Radioss.\",\"url\":\"/MagicDPD/posts/2022-09-09-vchera-kompaniya-altair-obyavila-ob-otkry/\"},{\"date\":\"2022-09-08\",\"title\":\"Сегодня я понял, что пора бы восстановить работу моего паблика, который был незаслуженно заморожен почти два месяца назад.\",\"url\":\"/MagicDPD/posts/2022-09-08-segodnya-ya-ponyal-chto-pora-by-vosstanovit/\"},{\"date\":\"2022-07-21\",\"title\":\"Сегодня у нас очень простая тема.\",\"url\":\"/MagicDPD/posts/2022-07-21-segodnya-u-nas-ochen-prostaya-tema-segodn/\"},{\"date\":\"2022-07-18\",\"title\":\"Интернет сейчас заполонили фотографии, сделанные новым орбитальным телескопом Джеймс Уэбб (James Webb Space Telescope, #JWST). А его ведь тоже кто-то считал в #Ansys, и расчеты были не самые обычные. Так, #NASA использовали #Zemax для моделирования оптической системы телескопа. Это понятно: есть оптика, нужен Zemax. Механика системы наведения зеркал - также понятное решение от #Ansys Mechanical. В блоге даже есть ссылка на научную статью по этой теме. А еще софт #AGI от Ansys использовался для определения оптимальной орбиты для телескопа с учетом сложных гравитационных полей и давления солнечного света (!\",\"url\":\"/MagicDPD/posts/2022-07-18-internet-seychas-zapolonili-fotografii-s/\"},{\"date\":\"2022-07-13\",\"title\":\"#Ansys опубликовал обзор новых фишек следующей своей версии 2022R2. Правда обзор получился какой-то куцый.\",\"url\":\"/MagicDPD/posts/2022-07-13-ansys-opublikoval-obzor-novyh-fishek-sle/\"},{\"date\":\"2022-07-12\",\"title\":\"Надо мне тут было посчитать одну деталь из хитрого ABS пластика, и я открыл для себя #CAMPUSplastics!\",\"url\":\"/MagicDPD/posts/2022-07-12-nado-mne-tut-bylo-poschitat-odnu-detal/\"},{\"date\":\"2022-07-11\",\"title\":\"#MYSTRAN (aka My Structural Analysis) - #opensource КЭ решатель, базирующийся на синтаксисте #NASTRAТ.\",\"url\":\"/MagicDPD/posts/2022-07-11-mystran-aka-my-structural-analysis/\"},{\"date\":\"2022-07-07\",\"title\":\"Джусеф Мурад (Jousef Murad), один из топовых международнзы #CAE болгеров, записал больше интервью с Гилбертом Стренгом (Gilbert Strang).\",\"url\":\"/MagicDPD/posts/2022-07-07-dzhusef-murad-jousef-murad-odin-iz-top/\"},{\"date\":\"2022-07-06\",\"title\":\"Теория и практика работы с моделью Муни-Ривлина для гиперупругих материалов. https://youtu.be/Pi8qRehqcvM\",\"url\":\"/MagicDPD/posts/2022-07-06-teoriya-i-praktika-raboty-s-modelyu-muni/\"},{\"date\":\"2022-07-05\",\"title\":\"Вебинар #Coreform посвященный математическим и геометрическим описаниям, которые обеспечивают работу #IGA. Настоятельно рекомендуется всем, кому становится тесно в традиционных сеточных подходах к решению прочностных задач. https://www.youtube.com/watch?\",\"url\":\"/MagicDPD/posts/2022-07-05-vebinar-coreform-posvyaschennyy-matematiche/\"},{\"date\":\"2022-07-04\",\"title\":\"#FluidX3D - это программное обеспечение для #CFD моделирования методом решетчатых уравнений Больцмана #LBM.\",\"url\":\"/MagicDPD/posts/2022-07-04-fluidx3d-eto-programmnoe-obespechenie/\"},{\"date\":\"2022-07-01\",\"title\":\"Сегодня у нас в меню ссылка на обзор разработок и все еще активных исследований в области методологии физического моделирования на основе #SPH.\",\"url\":\"/MagicDPD/posts/2022-07-01-segodnya-u-nas-v-menyu-ssylka-na-obzor-raz/\"},{\"date\":\"2022-06-28\",\"title\":\"Министерство национальной обороны Республики Польша опубликовало видео отчет о крушении самолета ТУ-154М, рейс PLF 101, которое произошло над аэродромом Смоленск-Северный в России 10 апреля 2010 года.\",\"url\":\"/MagicDPD/posts/2022-06-28-ministerstvo-natsionalnoy-oborony-respub/\"},{\"date\":\"2022-06-27\",\"title\":\"#Zebulon - это решатель конечных элементов из пакета #Zset, заточенный на решение задач нелинейного роста трещин и усталостного повержения.\",\"url\":\"/MagicDPD/posts/2022-06-27-zebulon-eto-reshatel-konechnyh-element/\"},{\"date\":\"2022-06-24\",\"title\":\"Новость специально для пользователей Windows.\",\"url\":\"/MagicDPD/posts/2022-06-24-novost-spetsialno-dlya-polzovateley-win/\"},{\"date\":\"2022-06-23\",\"title\":\"В настоящее время в воздухе находится почти 5 миллионов беспилотников, и ожидается, что к 2030 году их число возрастет до более чем до 9,6 миллионов. При таком быстром росте их количества - что произойдет, если дрон попадет вам в голову?\",\"url\":\"/MagicDPD/posts/2022-06-23-v-nastoyaschee-vremya-v-vozduhe-nahoditsya-po/\"},{\"date\":\"2022-06-22\",\"title\":\"Прямое численное моделирование взаимодействия капли с тонкой пристенной пленкой той же жидкости.\",\"url\":\"/MagicDPD/posts/2022-06-22-pryamoe-chislennoe-modelirovanie-vzaimodey/\"},{\"date\":\"2022-06-21\",\"title\":\"#Python #opensource фреймворк #automan Этот позволяет автоматизировать последовательность запуска ресурсоёмкий вычислительных задач из области #ML и #CAE (примеры прилагаются).\",\"url\":\"/MagicDPD/posts/2022-06-21-python-opensource-freymvork-automan-e/\"},{\"date\":\"2022-06-16\",\"title\":\"Свежий разбор #FEM #SOLID элементов для #Ansys #LSDYNA R13 - включены объяснения по самым новым формулировкам (-18) и самым нетривиальным подходам (64 узла на хекс) https://youtu.be/KZDfTKBS7bY\",\"url\":\"/MagicDPD/posts/2022-06-16-svezhiy-razbor-fem-solid-elementov-dlya/\"},{\"date\":\"2022-06-15\",\"title\":\"Консалтинговая компания в области #CFD расчетов #WolfDynamics на своем канале выложила огромный (87 видео!\",\"url\":\"/MagicDPD/posts/2022-06-15-konsaltingovaya-kompaniya-v-oblasti-cfd-r/\"},{\"date\":\"2022-06-13\",\"title\":\"В 1961 году Ашер Шапиро основал Национальный комитет по фильмам по механике жидкости (National Committee for Fluid Mechanics Films, NCFMF) в сотрудничестве с Центром развития образования и выпустил серию из 39 видеофильмов и сопроводительных текстов, которые произвели революцию в преподавании механики жидкости. Теперь и вы можете посмотреть эти фильмы!\",\"url\":\"/MagicDPD/posts/2022-06-13-v-1961-godu-asher-shapiro-osnoval-natsional/\"},{\"date\":\"2022-06-10\",\"title\":\"Любите ли вы делать визуализацию научных и инженерных данных красивой и понятной?\",\"url\":\"/MagicDPD/posts/2022-06-10-lyubite-li-vy-delat-vizualizatsiyu-nauchnyh/\"},{\"date\":\"2022-06-09\",\"title\":\"Свежая презентация по #Ansys #LSDYNA #ALE от #DYNAmore. Контент очень концентрированный. Прям как все учебные курсы по теме в одном видео. https://www.youtube.com/watch?\",\"url\":\"/MagicDPD/posts/2022-06-09-svezhaya-prezentatsiya-po-ansys-lsdyna-al/\"},{\"date\":\"2022-06-08\",\"title\":\"Я просто оставлю это здесь\",\"url\":\"/MagicDPD/posts/2022-06-08-ya-prosto-ostavlyu-eto-zdes/\"},{\"date\":\"2022-06-07\",\"title\":\"В  релиз #PreonLab 5.2 завезли многофазные течения для #SPH.\",\"url\":\"/MagicDPD/posts/2022-06-07-v--reliz-preonlab-52-zavezli-mnogofazn/\"},{\"date\":\"2022-06-06\",\"title\":\"Сегодня у нас не совсем #CAE новости. Группа ученых опубликовала в журнале Journal of Magnetic Resonance Imaging свое исследование, которое позволяет автоматически точно и быстро строить динамическую 3D картину течение крови в сердце. Причем данная картина строиться на основе данных #МРТ обработанных особой #deeplearning системой. Получается какой-то фантастический источник информации для исследователей работы сердца!\",\"url\":\"/MagicDPD/posts/2022-06-06-segodnya-u-nas-ne-sovsem-cae-novosti-gr/\"},{\"date\":\"2022-06-05\",\"title\":\"Важные объявления об дальнейшей работе паблика.\",\"url\":\"/MagicDPD/posts/2022-06-05-vazhnye-obyavleniya-ob-dalneyshey-rabote-p/\"},{\"date\":\"2022-06-01\",\"title\":\"Коллеги, сегодня я пользуюсь своим положением создателя проекта MagicDPD, и публикую новость про себя.\",\"url\":\"/MagicDPD/posts/2022-06-01-kollegi-segodnya-ya-polzuyus-svoim-polozh/\"},{\"date\":\"2022-05-31\",\"title\":\"Оказывается, что код #ViperBlast, про который я неоднократно писал, умеет рассчитывать детонацию не только конденсированных ВВ, но и решать задачи газовой детонации/дефраграции!\",\"url\":\"/MagicDPD/posts/2022-05-31-okazyvaetsya-chto-kod-viperblast-pro-ko/\"},{\"date\":\"2022-05-30\",\"title\":\"Коллеги из Applied Research Associates рассказывают про свои расчеты динамических задач в #Ansys #LSDYNA, но ошибочно называют их цифровыми двойниками. Задачи интересные, цифровых двойников тут нет (и слава богу). https://www.youtube.com/watch?\",\"url\":\"/MagicDPD/posts/2022-05-30-kollegi-iz-applied-research-associates-r/\"},{\"date\":\"2022-05-27\",\"title\":\"Специалист #Rand Simulation #FEA, Деннис Чен, рассказывает, как использование инструментов #Ansys может помочь инженерам улучшать медицинское оборудование. https://www.youtube.com/watch?\",\"url\":\"/MagicDPD/posts/2022-05-27-spetsialist-rand-simulation-fea-dennis/\"},{\"date\":\"2022-05-26\",\"title\":\"Компания Bentley Systems, Incorporated объявила о приобретении ADINA R\\u0026D Inc.\",\"url\":\"/MagicDPD/posts/2022-05-26-kompaniya-bentley-systems-incorporated-o/\"},{\"date\":\"2022-05-25\",\"title\":\"Южнокорейская компания #Metariver Technology Co., Ltd показала интересное.\",\"url\":\"/MagicDPD/posts/2022-05-25-yuzhnokoreyskaya-kompaniya-metariver-techno/\"},{\"date\":\"2022-05-24\",\"title\":\"#BetaCAE Systems объявили о том, что теперь в #ANSA добавлен (естественно за отдельную платную лицензию) #SPH решатель их собственно разработки.\",\"url\":\"/MagicDPD/posts/2022-05-24-betacae-systems-obyavili-o-tom-chto-tep/\"},{\"date\":\"2022-05-23\",\"title\":\"Метод вязких вихревых доменов (ВВД, viscous vortex domains, #VVD) - это #meshless метод вычислительной гидродинамики для прямого численного решения двумерных уравнений Навье-Стокса в координатах Лагранжа.\",\"url\":\"/MagicDPD/posts/2022-05-23-metod-vyazkih-vihrevyh-domenov-vvd-visc/\"},{\"date\":\"2022-05-20\",\"title\":\"#SPH моделирование внутрикорпусного удержание (IVR, in-vessel retention) расплава активной зоны путем внешнего охлаждения. Очень интересно, ничего не понятно. https://www.youtube.com/watch?\",\"url\":\"/MagicDPD/posts/2022-05-20-sph-modelirovanie-vnutrikorpusnogo-uder/\"},{\"date\":\"2022-05-19\",\"title\":\"Этот вебинар был представлен доктором Лореном Лоригом (Dr.\",\"url\":\"/MagicDPD/posts/2022-05-19-etot-vebinar-byl-predstavlen-doktorom-lo/\"},{\"date\":\"2022-05-18\",\"title\":\"Обзор работы модульных нелинейных моделей материалов *MAT_ADD_INELASTICITY в #LSDYNA R13\",\"url\":\"/MagicDPD/posts/2022-05-18-obzor-raboty-modulnyh-nelineynyh-modele/\"},{\"date\":\"2022-05-17\",\"title\":\"4 мая 2022 года компания #Ansys объявила о том, что она договорилась с  Motor Design Limited (#MDL) об их приобретении.\",\"url\":\"/MagicDPD/posts/2022-05-17-4-maya-2022-goda-kompaniya-ansys-obyavila/\"},{\"date\":\"2022-05-16\",\"title\":\"16 августа 2022 года в плимуте, штат Мичиган свой семина проведет международный консорциум Global Human Body Models Consortium (GHBMC).\",\"url\":\"/MagicDPD/posts/2022-05-16-16-avgusta-2022-goda-v-plimute-shtat-mich/\"},{\"date\":\"2022-05-13\",\"title\":\"В сеть выложили лекцию Томаса Дж.\",\"url\":\"/MagicDPD/posts/2022-05-13-v-set-vylozhili-lektsiyu-tomasa-dzh-r-hyu/\"},{\"date\":\"2022-05-12\",\"title\":\"Наконец #Ingeciber сделали видео про #CivilFEM for #ANSYS. И рассказа идет про полнофункциональный релиз 2022, построенного на базе великого и ужасного черного экрана смерти #ANSYS Classic #APDL. https://www.youtube.com/watch?\",\"url\":\"/MagicDPD/posts/2022-05-12-nakonets-ingeciber-sdelali-video-pro-ci/\"},{\"date\":\"2022-05-11\",\"title\":\"Нашел в сети цикл уроков по #Ansys #Mechanical.\",\"url\":\"/MagicDPD/posts/2022-05-11-nashel-v-seti-tsikl-urokov-po-ansys-mech/\"},{\"date\":\"2022-05-06\",\"title\":\"Продолжу тему #Endurica.\",\"url\":\"/MagicDPD/posts/2022-05-06-prodolzhu-temu-endurica-ya-nemnogo-proshe/\"},{\"date\":\"2022-05-05\",\"title\":\"По заявлениям разработчиков, #Endurica является лучшей в мире системой моделирования усталостной долговечности эластомеров.\",\"url\":\"/MagicDPD/posts/2022-05-05-po-zayavleniyam-razrabotchikov-endurica-ya/\"},{\"date\":\"2022-05-04\",\"title\":\"30 сентября 2017 года над Атлантикой произошла авиационная авария.\",\"url\":\"/MagicDPD/posts/2022-05-04-30-sentyabrya-2017-goda-nad-atlantikoy-pro/\"},{\"date\":\"2022-04-29\",\"title\":\"В 34-ом выпуске научного журнала Physics of Fluids (Q1, H-INDEX 180) была опубликована забавная статья по теме \\\"ореология\\\" (#oreology), от нубисковского \\\"#Oreo\\\" - \\\"печенье\\\" и греческого \\\"rheo logia\\\" - \\\"изучение течения\\\". Ореология изучает как происходит разрушение многослойного печения в следствии течения его крема!\",\"url\":\"/MagicDPD/posts/2022-04-29-v-34-om-vypuske-nauchnogo-zhurnala-physics/\"},{\"date\":\"2022-04-28\",\"title\":\"Резюме-обзор #Ansys #HFSS (High Frequency Simulation Software) от коллег из #Ozen. #EM https://youtu.be/itY9P3suscc\",\"url\":\"/MagicDPD/posts/2022-04-28-rezyume-obzor-ansys-hfss-high-frequenc/\"},{\"date\":\"2022-04-27\",\"title\":\"Первый #MATLAB (название сокращено от “MATrix LABoratory”) не был языком программирования.\",\"url\":\"/MagicDPD/posts/2022-04-27-pervyy-matlab-nazvanie-sokrascheno-ot-m/\"},{\"date\":\"2022-04-26\",\"title\":\"Знали ли вы, что для того, что бы научиться работать с #CivilFEM powered by #Marc и решать соответствующие задачи у компании #Ingeciber есть бесплатный учебный курс.\",\"url\":\"/MagicDPD/posts/2022-04-26-znali-li-vy-chto-dlya-togo-chto-by-nauchit/\"},{\"date\":\"2022-04-22\",\"title\":\"А вот новость этого года про использование #GPU для #CFD расчетов в #Fluent. В версии #Ansys 2022 R1 завезли beta версию, как я называю \\\"второго поколения\\\" CFD-GPU решателя, который получил название \\\"Ansys Multi-GPU Solver\\\". Данный решатель пока работает не для вех бесчисленных классов задач, решаемых Fluent. Но, вот для задач внешней аэродинамики, производительность решателя просто взлетает в космос!\",\"url\":\"/MagicDPD/posts/2022-04-22-a-vot-novost-etogo-goda-pro-ispolzovan/\"},{\"date\":\"2022-04-21\",\"title\":\"Для меня стало большой новостью, что только в этом году компания #Siemens таки смогла завести поддержку #GPU от #NVIDIA в свой флагманский #CFD решатель #Simcenter #STARCCM+ 2022.1. Стоит отметить, что у основного конкурента - #Ansys #Fluent поддержка GPU появилась чуть ли не 5 лет назад. Так что я как-то в замешательстве, как так получилось?\",\"url\":\"/MagicDPD/posts/2022-04-21-dlya-menya-stalo-bolshoy-novostyu-chto-tol/\"},{\"date\":\"2022-04-20\",\"title\":\"А знаете ли вы, что исходный код знаменитого #NASTRAN (#NASA Structural Analysis System) и сейчас лежит в свободном доступе в официальном репозитории NASA на #GitHub\",\"url\":\"/MagicDPD/posts/2022-04-20-a-znaete-li-vy-chto-ishodnyy-kod-znameni/\"},{\"date\":\"2022-04-19\",\"title\":\"Красивые результаты #LES моделирования спускаемого модуля на Марс выполнено командой #FLUMS (FLUid Modeling and Simulation) Падуанского университета (Università di Padova)  в сотрудничестве с Римским университетом Сапиенца (Sapienza Università di Roma)\",\"url\":\"/MagicDPD/posts/2022-04-19-krasivye-rezultaty-les-modelirovaniya-s/\"},{\"date\":\"2022-04-18\",\"title\":\"Любопытная штука - #BQPhy.  Они говорят, что они - это первый в мире программный комплекс CAE Simulations-as-a-Service (Q-SaaS) с расчетами на квантовом компьютере!\",\"url\":\"/MagicDPD/posts/2022-04-18-lyubopytnaya-shtuka-bqphy--oni-govoryat/\"},{\"date\":\"2022-04-15\",\"title\":\"Обычно, я занимаюсь моделированием быстропротекающих (что-то около скорости звука в материале) или хотя бы динамических (когда инерционная составляющая важна) процессов.\",\"url\":\"/MagicDPD/posts/2022-04-15-obychno-ya-zanimayus-modelirovaniem-bystr/\"},{\"date\":\"2022-04-14\",\"title\":\"Вчера #Ansys купил себе #OnScale, и я расскажу почему это важно.\",\"url\":\"/MagicDPD/posts/2022-04-14-vchera-ansys-kupil-sebe-onscale-i-ya-ra/\"},{\"date\":\"2022-04-13\",\"title\":\"Я уже писал про интересный открытый междисциплинарный решатель \\\"Лось\\\" (#MOOSE или Multiphysics Object-Oriented Simulation Environment).\",\"url\":\"/MagicDPD/posts/2022-04-13-ya-uzhe-pisal-pro-interesnyy-otkrytyy-mezhd/\"},{\"date\":\"2022-04-12\",\"title\":\"20 апреля пройдет бесплатный вебинар от Марека Ханачовски (Marek HANACZOWSKI), магистром мостостроения.\",\"url\":\"/MagicDPD/posts/2022-04-12-20-aprelya-proydet-besplatnyy-vebinar-ot/\"},{\"date\":\"2022-04-11\",\"title\":\"Компания #Siemens анонсировала начало многолетнего с #Pasqal для исследования возможности использования квантовых компьютеров при решении классических междисциплинарных задач математического моделирования физических процессов.\",\"url\":\"/MagicDPD/posts/2022-04-11-kompaniya-siemens-anonsirovala-nachalo-mn/\"},{\"date\":\"2022-04-08\",\"title\":\"#FlightStream - это инструмент для #CFD расчетов аэродинамики, идеально подходящий для авиаконструкторов.\",\"url\":\"/MagicDPD/posts/2022-04-08-flightstream-eto-instrument-dlya-cfd/\"},{\"date\":\"2022-04-07\",\"title\":\"#МАГАТЭ расскажет, как использовать #CFD коды для расчетов #АЭС в 2022 году!\",\"url\":\"/MagicDPD/posts/2022-04-07-magate-rasskazhet-kak-ispolzovat-cfd/\"},{\"date\":\"2022-04-06\",\"title\":\"Раньше все говорили, что моделировать композиты на микро уровне - это довольно сложно, если вообще возможно. Однако, прогресс не стоит на месте, и есть интересные подвижки в этом деле. Так, коллеги используют методологию моделирования на основе Метода Цифровых Элементов (Digital Element Approach, DEA). Хотя, если смотреть на описание данного метода, каждая нить композита дискретизирована на пучок волокон, а каждое отдельное волокно состояло из цепочки ферменных (стержневых) элементов. И тут я не понимаю, чем это отличается от стандартного подхода к моделированию балочными элементами?\",\"url\":\"/MagicDPD/posts/2022-04-06-ranshe-vse-govorili-chto-modelirovat-ko/\"},{\"date\":\"2022-04-05\",\"title\":\"Большая часть исследований в области гиперзвука сосредоточена на понимании возмущений в потоке газов у поверхности тела - пограничного слоя - а не на том, что происходит в ударной волне, которая обычно возникает в передней части тела.\",\"url\":\"/MagicDPD/posts/2022-04-05-bolshaya-chast-issledovaniy-v-oblasti-gip/\"},{\"date\":\"2022-04-04\",\"title\":\"Возможно вы слышали, что Ansys недавно выпустил #opensource библиотеку #pyAnsys, которая позволят использовать продукты и решетили #Ansys прямо из среды #Python.\",\"url\":\"/MagicDPD/posts/2022-04-04-vozmozhno-vy-slyshali-chto-ansys-nedavno-v/\"},{\"date\":\"2022-04-01\",\"title\":\"7 апреля шведское подразделение #DYNAmore будет рассказывать про идентификацию параметров для моделей #GISSMO и #DIEM. Данные модели являются стандартами де-факто при расчетах #LSDYNA в автомобильной промышленности. Они подключаются к большинству моделей материалов и позволяют учесть влияние на разупрочнение материала таких параметров, как трехосности, параметр Лоде и неустойчивость пластического течения. Так что подключайтесь к бесплатному мероприятию и впитывайте знания!\",\"url\":\"/MagicDPD/posts/2022-04-01-7-aprelya-shvedskoe-podrazdelenie-dynamor/\"},{\"date\":\"2022-03-31\",\"title\":\"Конец эпохи\",\"url\":\"/MagicDPD/posts/2022-03-31-konets-epohi/\"},{\"date\":\"2022-03-30\",\"title\":\"Примеры работы нового генератора сварных швов в #Ansys #Mechanical 2022R1. Кстати, теперь такие швы можно делать и между shell и solid телами!\",\"url\":\"/MagicDPD/posts/2022-03-30-primery-raboty-novogo-generatora-svarnyh/\"},{\"date\":\"2022-03-29\",\"title\":\"Ansys LST ведет работу по удалению всех ссылок на слова \\\"Master\\\" и \\\"Slave\\\" из программного обеспечения LS-DYNA, руководств и другого программного обеспечения, такого как LS-PrePost.\",\"url\":\"/MagicDPD/posts/2022-03-29-ansys-lst-vedet-rabotu-po-udaleniyu-vseh/\"},{\"date\":\"2022-03-25\",\"title\":\"Давно я ничего не постил про #concrete!\",\"url\":\"/MagicDPD/posts/2022-03-25-davno-ya-nichego-ne-postil-pro-concrete/\"},{\"date\":\"2022-03-24\",\"title\":\"Продолжаем изучать суровый #opensource.\",\"url\":\"/MagicDPD/posts/2022-03-24-prodolzhaem-izuchat-surovyy-opensource/\"},{\"date\":\"2022-03-23\",\"title\":\"Пересядем на суровый #opensource?\",\"url\":\"/MagicDPD/posts/2022-03-23-peresyadem-na-surovyy-opensource-many-p/\"},{\"date\":\"2022-03-22\",\"title\":\"#PyFR - это фреймворк на базе #Python с открытым исходным кодом для решения задач типа адвекции-диффузии на потоковых архитектурах с использованием подхода Flux Reconstruction Хуинха (Huynh), что бы это не значило.\",\"url\":\"/MagicDPD/posts/2022-03-22-pyfr-eto-freymvork-na-baze-python-s/\"},{\"date\":\"2022-03-21\",\"title\":\"В прошлом моем посте про #APM, читатели попросили меня обратить большее внимание на отечественные коды #Fidesys и #ЛОГОС.\",\"url\":\"/MagicDPD/posts/2022-03-21-v-proshlom-moem-poste-pro-apm-chitateli/\"},{\"date\":\"2022-03-18\",\"title\":\"Небольшое обзорное видео по APM Studio - российскому не стыдному CAE комплексу. В целом, выглядит очень похоже на Ansys Workbench пару тройку лет назад. Коллеги, есть у кого что рассказать про реальный опыт применения софта от НТЦ АПМ?\",\"url\":\"/MagicDPD/posts/2022-03-18-nebolshoe-obzornoe-video-po-apm-studio/\"},{\"date\":\"2022-03-17\",\"title\":\"В современном мире открытых свободных КЭ кодов для решения прочностных задач вы можете найти очень много интересных продуктов.\",\"url\":\"/MagicDPD/posts/2022-03-17-v-sovremennom-mire-otkrytyh-svobodnyh-ke/\"},{\"date\":\"2022-03-16\",\"title\":\"Создатель проекта #EnterFEA показали тизер своего авторского учебного курса по нелинейным расчетам КЭ расчетам.\",\"url\":\"/MagicDPD/posts/2022-03-16-sozdatel-proekta-enterfea-pokazali-tiz/\"},{\"date\":\"2022-03-15\",\"title\":\"VR Sketch - это расширение для SketchUp, которое дает любому человеку возможность создавать, редактировать и просматривать свои модели в VR.\",\"url\":\"/MagicDPD/posts/2022-03-15-vr-sketch-eto-rasshirenie-dlya-sketchup/\"},{\"date\":\"2022-03-14\",\"title\":\"CFD расчет охлаждения реактора со свинцовым охлаждением на примере проекта \\\"Nuclear Thermal Hydraulics\\\", который финансируется Министерством бизнеса, энергетики и промышленной стратегии (BEIS, depa аконченным набором инструментов, который позволяет почти без боли и консоли разворачивать настоящие суперкомпьютеры с правильно настроенными из коробки планировщиками #PBS, #LSF, #Slurm, параллельными файловыми системами и прочими необходимыми надстройками. При этом, все делается через удобный WEB-UI. Была даже бесплатная версия для кластеров до 8 узлов. Страшно сказать: у BCM даже была своя собственная система доставки драйверов для #Infiniband (Mellanox, кстати, тоже поглощён NVIDIA) с дополнительным уровнем тестирования на совместимость и стабильность!\",\"url\":\"/MagicDPD/posts/2022-01-11-nvidia-prodolzhaet-svoe-dvizhenie-v-storo/\"},{\"date\":\"2022-01-10\",\"title\":\"📃 Очень эффектные результаты от #CFD решателя #LAVA\",\"url\":\"/MagicDPD/posts/2022-01-10-ochen-effektnye-rezultaty-ot-cfd-resh/\"},{\"date\":\"2022-01-09\",\"title\":\"Коллеги подогнали свежее видео с канала FEA for ALL о том, как можно в #Salome с #Python и такой-то матерью сгенерировать сложный объект, вроде массива бетона с включениями.\",\"url\":\"/MagicDPD/posts/2022-01-09-kollegi-podognali-svezhee-video-s-kanala/\"},{\"date\":\"2022-01-07\",\"title\":\"Это видео иллюстрирует крупномасштабный трехмерный КЭ расчет, выполненный в #ONERA с помощью программного обеспечения #Zset finite element с использованием автоматических адаптивных сеток.\",\"url\":\"/MagicDPD/posts/2022-01-07-eto-video-illyustriruet-krupnomasshtabnyy/\"},{\"date\":\"2022-01-07\",\"title\":\"11 января 2022 года в 18:00 по Москве #DRD Technology Corporation проведет вебинар по моделированию смазки зубчатых передач.\",\"url\":\"/MagicDPD/posts/2022-01-07-11-yanvarya-2022-goda-v-1800-po-moskve-d/\"},{\"date\":\"2022-01-06\",\"title\":\"Большой обзор возможностей ветки #CivilFEM 2021 для решателя #MSC #Marc по моделированию бетона, армированного волокнами (Fiber-reinforced concrete, #FRC). Я вот тоже такое хочу посчитать, но пока не нашел генератора \\\"соломы\\\", который сможет сгенерировать массив хаотически армированных в     const postsByDate = {};
    allPosts.forEach(function(p) {
        if (!postsByDate[p.date]) postsByDate[p.date] = [];
        postsByDate[p.date].push({ title: p.title, url: p.url });
    });

    const MONTHS_RU = [
        'Январь','Февраль','Март','Апрель','Май','Июнь',
        'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'
    ];
    const DAYS_RU = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

    
    const years = [...new Set(
        Object.keys(postsByDate).map(function(d) { return parseInt(d.slice(0, 4)); })
    )].sort(function(a, b) { return b - a; });

    let selectedYear = years[0];
    let selectedDateKey = null;

    
    const totalPosts = allPosts.length;
    const totalDays = Object.keys(postsByDate).length;
    document.getElementById('archive-stats').textContent =
        'Всего постов: ' + totalPosts + ' за ' + totalDays + ' дней';

    
    function renderYearNav() {
        const nav = document.getElementById('year-nav');
        nav.innerHTML = '<span class="year-nav-label">Год:</span>';
        years.forEach(function(year) {
            const btn = document.createElement('button');
            btn.className = 'year-btn' + (year === selectedYear ? ' active' : '');
            btn.textContent = year;
            btn.addEventListener('click', function() {
                selectedYear = year;
                selectedDateKey = null;
                hidePanel();
                renderYearNav();
                renderCalendar();
            });
            nav.appendChild(btn);
        });
    }

    
    function getDow(date) {
        return (date.getDay() + 6) % 7;
    }

    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';

        for (var month = 0; month < 12; month++) {
            var daysInMonth = new Date(selectedYear, month + 1, 0).getDate();
            var startDow = getDow(new Date(selectedYear, month, 1));

            var monthEl = document.createElement('div');
            monthEl.className = 'cal-month';

            var titleEl = document.createElement('div');
            titleEl.className = 'cal-month-title';
            titleEl.textContent = MONTHS_RU[month];
            monthEl.appendChild(titleEl);

            var weekdaysEl = document.createElement('div');
            weekdaysEl.className = 'cal-weekdays';
            DAYS_RU.forEach(function(d) {
                var wd = document.createElement('div');
                wd.className = 'cal-weekday';
                wd.textContent = d;
                weekdaysEl.appendChild(wd);
            });
            monthEl.appendChild(weekdaysEl);

            var daysEl = document.createElement('div');
            daysEl.className = 'cal-days';

            
            for (var i = 0; i < startDow; i++) {
                var empty = document.createElement('div');
                empty.className = 'cal-day empty';
                daysEl.appendChild(empty);
            }

            for (var day = 1; day <= daysInMonth; day++) {
                (function(d, m, y) {
                    var dateKey = y + '-' +
                        String(m + 1).padStart(2, '0') + '-' +
                        String(d).padStart(2, '0');
                    var hasPosts = !!postsByDate[dateKey];
                    var dow = getDow(new Date(y, m, d));
                    var isWeekend = dow >= 5;

                    var dayEl = document.createElement('div');
                    var cls = 'cal-day';
                    if (isWeekend) cls += ' weekend';
                    if (hasPosts) cls += ' has-posts';
                    if (dateKey === selectedDateKey) cls += ' selected';
                    dayEl.className = cls;
                    dayEl.textContent = d;

                    if (hasPosts) {
                        var count = postsByDate[dateKey].length;
                        dayEl.title = count + ' ' + (count === 1 ? 'пост' : count < 5 ? 'поста' : 'постов');
                        dayEl.addEventListener('click', function() { selectDate(dateKey); });
                    }

                    daysEl.appendChild(dayEl);
                })(day, month, selectedYear);
            }

            monthEl.appendChild(daysEl);
            grid.appendChild(monthEl);
        }
    }

    function selectDate(dateKey) {
        if (selectedDateKey === dateKey) {
            selectedDateKey = null;
            hidePanel();
            renderCalendar();
            return;
        }
        selectedDateKey = dateKey;
        renderCalendar();
        showPanel(dateKey);
    }

    function showPanel(dateKey) {
        var posts = postsByDate[dateKey] || [];
        var parts = dateKey.split('-');
        var y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
        var count = posts.length;
        var noun = count === 1 ? 'пост' : count < 5 ? 'поста' : 'постов';
        var dateStr = d + ' ' + MONTHS_RU[m - 1] + ' ' + y;

        document.getElementById('posts-panel-title').textContent =
            dateStr + ' — ' + count + ' ' + noun;

        var list = document.getElementById('posts-list');
        list.innerHTML = '';
        posts.forEach(function(post) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = post.url;
            a.textContent = post.title || '(без названия)';
            li.appendChild(a);
            list.appendChild(li);
        });

        var panel = document.getElementById('posts-panel');
        panel.classList.add('visible');
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hidePanel() {
        document.getElementById('posts-panel').classList.remove('visible');
    }

    document.getElementById('posts-panel-close').addEventListener('click', function() {
        selectedDateKey = null;
        hidePanel();
        renderCalendar();
    });

    renderYearNav();
    renderCalendar();
})();
</script>
